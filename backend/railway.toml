[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "app/**",
  "alembic/**",
  "scripts/**",
  "alembic.ini",
  "docker-entrypoint.sh",
  "Dockerfile",
  "pyproject.toml",
  "runtime.txt",
  "railway.toml"
]

[deploy]
preDeployCommand = "sh scripts/railway-predeploy.sh"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
