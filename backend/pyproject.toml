[project]
name = "enterprise-data-backend"
version = "0.1.0"
description = "FastAPI backend for Atlas FieldOps"
requires-python = ">=3.12"
dependencies = [
  "aiokafka>=0.10",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "bcrypt>=4.1",
  "email-validator>=2.1",
  # fastapi 0.137 introduces _IncludedRouter route objects that break
  # prometheus-fastapi-instrumentator's route iteration
  # ("'_IncludedRouter' object has no attribute 'path'"). Cap below 0.137
  # until the instrumentator supports it.
  "fastapi>=0.111,<0.137",
  "opentelemetry-api>=1.24",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "prometheus-fastapi-instrumentator>=7.0,<8.0",
  "pydantic-settings>=2.2",
  "python-jose[cryptography]>=3.3",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "shapely>=2.0",
  "sqlalchemy[asyncio]>=2.0",
  # Pin to the starlette 0.x major that fastapi 0.136 was built against;
  # starlette 1.x is a breaking major.
  "starlette>=0.40,<1.0",
  "structlog>=24.1",
  "uvicorn[standard]>=0.29"
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.4"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiokafka", "jose", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
