[project]
name = "enterprise-data-ai-services"
version = "0.1.0"
description = "AI-assisted OCR and validation services"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "openai>=1.30",
  "pydantic-settings>=2.2",
  "structlog>=24.1",
  "uvicorn[standard]>=0.29"
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.4"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
